<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 340"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#090d16"/></linearGradient><linearGradient id="accentCyan" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="accentPurple" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".07"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><filter id="glowCyan" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="12"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="glowPurple" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="20"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes floatParticle{0%{transform:translateY(0) scale(1);opacity:.4}50%{transform:translateY(-18px) scale(1.15);opacity:.8}}@keyframes pulseGlow{0%{opacity:.3;transform:scale(.98)}50%{opacity:.7;transform:scale(1.02)}}@keyframes strokeFlow{0%{stroke-dashoffset:400}}.particle-1{animation:floatParticle 6s ease-in-out infinite}.particle-2{animation:floatParticle 8s ease-in-out infinite 1s}.particle-3{animation:floatParticle 7s ease-in-out infinite 2s}.glow-bg{animation:pulseGlow 5s ease-in-out infinite;transform-origin:center}.grid-line{stroke:rgba(255,255,255,.05);stroke-width:1}.flowing-path{stroke-dasharray:200;animation:strokeFlow 10s linear infinite}</style></defs><rect width="1200" height="340" fill="url(#bgGrad)" rx="16"/><g class="glow-bg"><circle cx="180" cy="90" r="140
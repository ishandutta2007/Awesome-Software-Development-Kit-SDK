<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Glassmorphism overlay gradient for backdrop card -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Filters for glows -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Animated Elements Styling -->
    <style>
      @keyframes floatParticle {
        0% { transform: translateY(0px) scale(1); opacity: 0.4; }
        50% { transform: translateY(-18px) scale(1.15); opacity: 0.8; }
        100% { transform: translateY(0px) scale(1); opacity: 0.4; }
      }
      @keyframes pulseGlow {
        0% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 0.7; transform: scale(1.02); }
        100% { opacity: 0.3; transform: scale(0.98); }
      }
      @keyframes strokeFlow {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
      .particle-2 { animation: floatParticle 8s ease-in-out infinite 1s; }
      .particle-3 { animation: floatParticle 7s ease-in-out infinite 2s; }
      .glow-bg { animation: pulseGlow 5s ease-in-out infinite; transform-origin: center; }
      .grid-line { stroke: rgba(255, 255, 255, 0.05); stroke-width: 1; }
      .flowing-path {
        stroke-dasharray: 200;
        animation: strokeFlow 10s linear infinite;
      }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="340" fill="url(#bgGrad)" rx="16"/>

  <!-- Dynamic Glowing Background Orbs (Behind backdrop) -->
  <g class="glow-bg">
    <circle cx="180" cy="90" r="140" fill="url(#accentCyan)" opacity="0.35" filter="url(#glowCyan)"/>
    <circle cx="1020" cy="250" r="160" fill="url(#accentPurple)" opacity="0.3" filter="url(#glowPurple)"/>
  </g>

  <!-- Grid Pattern Overlay -->
  <g>
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line" />
    <line x1="200" y1="0" x2="200" y2="340" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="340" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="340" class="grid-line" />
    <line x1="800" y1="0" x2="800" y2="340" class="grid-line" />
    <line x1="1000" y1="0" x2="1000" y2="340" class="grid-line" />
  </g>

  <!-- Floating Dynamic Tech Decorative Particles (In background/midground) -->
  <g>
    <circle class="particle-1" cx="120" cy="220" r="6" fill="#38bdf8" />
    <circle class="particle-2" cx="1080" cy="80" r="8" fill="#c084fc" />
    <circle class="particle-3" cx="940" cy="280" r="5" fill="#f472b6" />
    <circle class="particle-1" cx="240" cy="70" r="4" fill="#818cf8" />
  </g>

  <!-- Code / SDK Connected Nodes Graphic (Right side background graphic) -->
  <g opacity="0.25" class="particle-2">
    <path d="M 850 170 L 930 110 L 1030 170 L 930 230 Z" fill="none" stroke="#38bdf8" stroke-width="2" class="flowing-path"/>
    <circle cx="850" cy="170" r="5" fill="#38bdf8"/>
    <circle cx="930" cy="110" r="5" fill="#c084fc"/>
    <circle cx="1030" cy="170" r="5" fill="#38bdf8"/>
    <circle cx="930" cy="230" r="5" fill="#f472b6"/>
  </g>

  <!-- FOREGROUND: Glassmorphism Container Card ensuring high readability -->
  <rect x="50" y="45" width="1100" height="250" rx="20" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>

  <!-- FOREGROUND TEXT (guaranteed front layer, unhidden) -->
  <g text-anchor="middle">
    <!-- Top Pill Badge -->
    <rect x="475" y="75" width="250" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
    <text x="600" y="96" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">
      DEVELOPER TOOLCHAINS &amp; SDKS
    </text>

    <!-- Main Title -->
    <text x="600" y="165" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">
      Awesome Software Development Kit (SDK)
    </text>

    <!-- Subtitle -->
    <text x="600" y="210" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400">
      Curated Ecosystem of SaaS SDKs, Cloud Libraries &amp; Open-Source Language Toolchains
    </text>

    <!-- Feature Pills / Highlights -->
    <g transform="translate(0, 240)">
      <!-- Pill 1: Cloud SDKs -->
      <rect x="360" y="0" width="130" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="425" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">☁️ Cloud SDKs</text>

      <!-- Pill 2: Open Source -->
      <rect x="505" y="0" width="145" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="577" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ Open Source</text>

      <!-- Pill 3: Native Toolchains -->
      <rect x="665" y="0" width="175" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="752" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🛠️ Platform Runtimes</text>
    </g>
  </g>
</svg>
